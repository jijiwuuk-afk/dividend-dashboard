name: Update portfolio news
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect latest news and market data
        run: python scripts/update_news.py
      - name: Commit updated news
        run: |
          git config user.name "portfolio-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/market_data.json
          git diff --cached --quiet || git commit -m "Update portfolio data"
          git push
